plugins {
    id 'com.android.application'
}

android {
    namespace 'de.polla.echoradio'
    compileSdk 34

    defaultConfig {
        applicationId 'de.polla.echoradio'
        minSdk 26
        // Der Echo Show laeuft mit LineageOS 18.1 = Android 11 (API 30)
        targetSdk 30
        // Nur ARM-Bibliotheken fuer Vosk einpacken (der Echo Show hat einen ARM-Prozessor)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        versionCode 16
        versionName '1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ExoPlayer (Media3): spielt auch AAC-Streams zuverlaessig und liefert Songtitel (ICY)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-extractor:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    // Vosk: lokale Spracherkennung (Modell wird zur Laufzeit geladen)
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
