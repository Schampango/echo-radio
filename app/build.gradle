plugins {
    id 'com.android.application'
}

android {
    namespace 'de.polla.echoradio'
    compileSdk 34

    defaultConfig {
        applicationId 'de.polla.echoradio'
        minSdk 26
        // Der Echo Show laeuft mit LineageOS 18.1 = Android 11 (API 30)
        targetSdk 30
        versionCode 6
        versionName '1.4.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
